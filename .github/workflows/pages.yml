name: Publish to GitHub Pages
# Публикация намеренно только вручную. Никакого автодеплоя при push.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check before publish
        run: npm run check
      - name: Prepare static site
        run: |
          mkdir -p dist/assets
          cp index.html styles.css main.js data.js sw.js manifest.webmanifest dist/
          cp assets/* dist/assets/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
